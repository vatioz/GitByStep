<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140" fill="none">
  <defs>
    <!-- Mark Background Gradient -->
    <linearGradient id="logoMarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- Mark Border Gradient -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2fc4a0" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Branch Gradients -->
    <linearGradient id="logoTrunk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2fc4a0"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <linearGradient id="logoCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="stepTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="gitTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- ==================== LOGO ICON MARK (Left, 110x110) ==================== -->
  <g transform="translate(15, 15)">
    <!-- Base App Tile -->
    <rect x="0" y="0" width="110" height="110" rx="26" fill="url(#logoMarkBg)" stroke="url(#logoBorder)" stroke-width="2"/>

    <!-- Subtle Step Grid -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 3">
      <line x1="18" y1="82" x2="92" y2="82"/>
      <line x1="18" y1="56" x2="92" y2="56"/>
      <line x1="18" y1="28" x2="92" y2="28"/>
    </g>

    <!-- Step Indicator Chevrons -->
    <g stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M52 71 L62 80 L52 89" stroke="#5b9dff" stroke-width="5"/>
      <path d="M66 71 L76 80 L66 89" stroke="#2fc4a0" stroke-width="5"/>
    </g>

    <!-- Main Trunk -->
    <path d="M34 82 V28" stroke="url(#logoTrunk)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Branch -->
    <path d="M34 56 C44 56 58 48 78 28" stroke="url(#logoCurve)" stroke-width="7.5" stroke-linecap="round" fill="none"/>

    <!-- Nodes -->
    <circle cx="34" cy="82" r="9" fill="#2fc4a0" stroke="#080b12" stroke-width="3"/>
    <circle cx="34" cy="82" r="3" fill="#ffffff" opacity="0.9"/>

    <circle cx="34" cy="28" r="9" fill="#5b9dff" stroke="#080b12" stroke-width="3"/>
    <circle cx="34" cy="28" r="3" fill="#ffffff" opacity="0.9"/>

    <circle cx="78" cy="28" r="10" fill="#f43f5e" stroke="#080b12" stroke-width="3"/>
    <circle cx="78" cy="28" r="4" fill="#ffffff"/>
  </g>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <g transform="translate(150, 20)">
    <!-- Main Wordmark: GitByStep -->
    <text x="0" y="62" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="url(#gitTextGrad)">Git</tspan>
      <tspan fill="#64748b" font-weight="400">By</tspan>
      <tspan fill="url(#stepTextGrad)">Step</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="92" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', monospace" font-size="13.5" font-weight="600" fill="#94a3b8" letter-spacing="0.16em">
      INTERACTIVE GIT SCENARIOS
    </text>
  </g>
</svg>