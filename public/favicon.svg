<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="gbs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2a"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="gbs-trunk" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2fc4a0"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <linearGradient id="gbs-branch" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="60%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="gbs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base App Tile -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#gbs-bg)" stroke="url(#gbs-border)" stroke-width="1.2"/>

  <!-- Stepping Grid Lines (Subtle Step Markers) -->
  <line x1="6" y1="23" x2="26" y2="23" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="1 3" stroke-width="1"/>
  <line x1="6" y1="16" x2="26" y2="16" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="1 3" stroke-width="1"/>
  <line x1="6" y1="9" x2="26" y2="9" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="1 3" stroke-width="1"/>

  <!-- Git Graph Branches -->
  <!-- Main Trunk -->
  <path d="M10 23 V9" stroke="url(#gbs-trunk)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Branch Curve -->
  <path d="M10 16 C12.5 16 16.5 14 22 9" stroke="url(#gbs-branch)" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Step Forward Arrow (ByStep motion) -->
  <path d="M14.5 19.5 L18 22.5 L14.5 25.5" stroke="#5b9dff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M19 19.5 L22.5 22.5 L19 25.5" stroke="#2fc4a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Commit Nodes -->
  <!-- Node 1: Base / Local Root -->
  <circle cx="10" cy="23" r="3.2" fill="#2fc4a0" stroke="#090d14" stroke-width="1.6"/>

  <!-- Node 2: Trunk Head -->
  <circle cx="10" cy="9" r="3.2" fill="#5b9dff" stroke="#090d14" stroke-width="1.6"/>

  <!-- Node 3: Feature Branch Head (Active Step) -->
  <circle cx="22" cy="9" r="3.5" fill="#f43f5e" stroke="#090d14" stroke-width="1.6"/>
  <circle cx="22" cy="9" r="1.3" fill="#ffffff"/>
</svg>