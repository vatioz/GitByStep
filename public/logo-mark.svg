<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="45%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2fc4a0" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Branch Main Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2fc4a0"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>

    <!-- Branch Curve Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b9dff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Step Chevron Gradient -->
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2fc4a0"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="36" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Node Halo Filter -->
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile with Ambient Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Background Ambient Glow Pools -->
  <circle cx="352" cy="150" r="110" fill="#a855f7" opacity="0.16" filter="url(#ambientGlow)"/>
  <circle cx="160" cy="360" r="95" fill="#2fc4a0" opacity="0.14" filter="url(#ambientGlow)"/>
  <circle cx="160" cy="150" r="95" fill="#38bdf8" opacity="0.14" filter="url(#ambientGlow)"/>

  <!-- Step Grid Guides (Subtle horizontal timeline lanes) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="4 8">
    <line x1="96" y1="360" x2="416" y2="360"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="150" x2="416" y2="150"/>
  </g>

  <!-- Step Indicator Chevrons (Representing the "ByStep" forward playback) -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M232 320 L276 360 L232 400" stroke="#5b9dff" stroke-width="22"/>
    <path d="M296 320 L340 360 L296 400" stroke="#2fc4a0" stroke-width="22"/>
  </g>

  <!-- Git Graph Trunk & Branches -->
  <!-- Main Trunk Line -->
  <path d="M160 360 V150" stroke="url(#trunkGrad)" stroke-width="32" stroke-linecap="round"/>

  <!-- Feature Branch Splitting and Merging/Ascending to Step 3 -->
  <path d="M160 256 C205 256 265 220 352 150" stroke="url(#curveGrad)" stroke-width="32" stroke-linecap="round" fill="none"/>

  <!-- Commit Node 1: Root / Local Base -->
  <g filter="url(#haloGlow)">
    <circle cx="160" cy="360" r="50" fill="#2fc4a0" opacity="0.25"/>
    <circle cx="160" cy="360" r="38" fill="#2fc4a0" stroke="#0b1019" stroke-width="12"/>
    <circle cx="160" cy="360" r="14" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Commit Node 2: Trunk Head -->
  <g filter="url(#haloGlow)">
    <circle cx="160" cy="150" r="50" fill="#5b9dff" opacity="0.25"/>
    <circle cx="160" cy="150" r="38" fill="#5b9dff" stroke="#0b1019" stroke-width="12"/>
    <circle cx="160" cy="150" r="14" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Commit Node 3: Active Step / Feature Head -->
  <g filter="url(#haloGlow)">
    <circle cx="352" cy="150" r="58" fill="#f43f5e" opacity="0.32"/>
    <circle cx="352" cy="150" r="44" fill="#f43f5e" stroke="#0b1019" stroke-width="12"/>
    <circle cx="352" cy="150" r="18" fill="#ffffff"/>
  </g>
</svg>